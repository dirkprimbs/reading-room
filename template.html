<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirk's Reading Room</title>
<meta name="description" content="Dirk's BookWyrm shelves as a cozy living room: what he has read, is reading and wants to read, with his ratings and reviews.">
__FONTS__
<style>
:root {
  /* One night-time room, lamp-lit: bookcase on the left, reading nook in the middle, to-read piles on the right, all standing on one floor. */
  --wall: #2a211d;
  --wall-stripe: #2f2520;
  --wood: #7a4e2d;
  --wood-dark: #4a2d18;
  --lamp: #ffd08a;
  --ink: #f4e8d6;
  --muted: #bba68b;
  --chair: #4d5b3a;
  --rug: #24474a;
  --font-display: "Young Serif", Georgia, serif;
  --font-body: "Alegreya Sans", "Trebuchet MS", sans-serif;
  --font-spine: "Alegreya Sans SC", "Alegreya Sans", sans-serif;
  --font-hand: "Caveat", "Comic Sans MS", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #2e1c0f;  /* same as the credits strip below the floor */
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
}
.room {
  position: relative;
  overflow: hidden;
  min-height: 100%;
  background:
    repeating-linear-gradient(90deg, var(--wall) 0 46px, var(--wall-stripe) 46px 50px);
}
/* warm light from the lamp over the whole room */
.room::before, .room.phone .scene-box::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 55% 60% at var(--glow-x, 55%) 62%, rgba(255, 196, 120, .20), rgba(255, 196, 120, .06) 45%, transparent 75%);
  z-index: 3;
  mix-blend-mode: screen;
}
.room.daylight { --wall: #382c26; --wall-stripe: #3d3029; }
.room.daylight::before, .room.daylight.phone .scene-box::before { background: radial-gradient(ellipse 30% 45% at 55% 32%, rgba(200, 225, 255, .14), rgba(200, 225, 255, .04) 50%, transparent 75%); }
.daylight .lamp .halo, .daylight .lamp .bulb { display: none; }
.daylight .lamp .shade { background: linear-gradient(180deg, #d8c7a4, #b89c70); }
.stage {
  position: relative;
  z-index: 1;
  margin-bottom: -18px;  /* furniture stands on the floorboards, not on the skirting line */
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  gap: 28px 18px;
  padding: 32px 20px 0;
  max-width: 1400px;
  margin: 0 auto;
}
/* keep the whole room in one row and scale it like a picture */
.stage.scene { width: 1673px; max-width: none; flex-wrap: nowrap; }
.stage.scene .bookcase, .stage.scene .case-top-row { width: 600px; }
.stage.scene .nook { width: 470px; }
.stage.scene .piles-wrap { width: 330px; }
/* on a phone the room fills the screen's height and scrolls sideways; the wall scrolls along with it */
html.phone, html.phone body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.room.phone { display: flex; flex-direction: column; }
.room.phone::before { display: none; }
.room.phone .scroller { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior: contain; scrollbar-width: none; }
.room.phone .scroller::-webkit-scrollbar { display: none; }
.room.phone .scene-box { position: relative; width: max-content; background: repeating-linear-gradient(90deg, var(--wall) 0 46px, var(--wall-stripe) 46px 50px); }
.room.phone .stage { margin: 0; }
.room.phone .floor { width: 1673px; }
.room.phone .credits { padding: 4px 12px 6px; font-size: 11.5px; line-height: 1.3; }
.grounded { position: relative; }
.grounded::after {
  content: "";
  position: absolute;
  z-index: -1;
  left: var(--shadow-l, 4%); right: var(--shadow-r, 4%);
  bottom: -7px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 70%);
  pointer-events: none;
}
.floor {
  position: relative;
  height: 70px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 140px),
    linear-gradient(180deg, #5a3820, #3f2614);
  box-shadow: inset 0 8px 10px -6px rgba(0,0,0,.6);
}
.rug {
  position: absolute;
  left: 50%;
  top: 6px;
  width: min(760px, 80%);
  height: 46px;
  transform: translateX(-42%);
  border-radius: 50%;
  background:
    radial-gradient(ellipse at center, transparent 58%, rgba(255,208,138,.25) 59% 61%, transparent 62%),
    var(--rug);
  box-shadow: 0 4px 8px rgba(0,0,0,.4);
}
.shelf-link { color: inherit; text-decoration: none; pointer-events: auto; border-radius: 3px; }
.shelf-link:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.shelf-link:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.room.pride .rug {
  background:
    linear-gradient(rgba(40, 25, 15, .2), rgba(40, 25, 15, .2)),
    radial-gradient(ellipse closest-side, #732982 0 18%, #24408e 18% 34%, #008026 34% 50%, #ffed00 50% 66%, #ff8c00 66% 82%, #e40303 82% 100%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 0 18px rgba(0,0,0,.35), 0 4px 8px rgba(0,0,0,.4);
}
.hand {
  font-family: var(--font-hand);
  font-size: 26px;
  font-weight: 700;
  color: var(--lamp);
  line-height: 1;
}
.hand small { font-size: 20px; color: var(--muted); font-weight: 500; }

/* ---------- bookcase ---------- */
.bookcase-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.case-deco, .floor-deco { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.d-case-floor-l { left: 36px; bottom: -16px; }
.d-case-floor-r { right: 30px; bottom: -16px; }
.d-case-top { left: 0; right: 0; top: 124px; }
.d-case-top svg { width: 100%; height: auto; }
.d-case-corner { right: 16px; top: 148px; }
.d-case-wall { right: 30px; top: -70px; }
.d-case-hang { left: -8px; top: 136px; }
.d-case-banner { left: 50%; top: -176px; transform: translateX(-50%); }
.d-floor { left: 0; right: 0; top: 4px; height: 60px; }
.bookcase-top { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; padding: 0 22px; }
.bookcase {
  width: min(600px, calc(100vw - 40px));
  border: 16px solid var(--wood);
  border-bottom-width: 26px;
  border-radius: 4px;
  background: var(--wood-dark);
  box-shadow: 0 0 0 2px #2a170b, 10px 14px 30px rgba(0,0,0,.55);
}
.shelf-row { display: flex; align-items: flex-end; width: 100%; height: var(--row); }
.shelves {
  --row: 134px;
  --plank: 20px;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  row-gap: var(--plank);
  padding: 0 10px var(--plank);
  background:
    repeating-linear-gradient(180deg,
      #24150a 0, #301d0f calc(var(--row) - 1px),
      #8a5a34 calc(var(--row) - 1px), var(--wood) calc(var(--row) + 4px), #5e3b20 calc(var(--row) + var(--plank)));
}
.slot { height: var(--row); display: flex; align-items: flex-end; }
.book {
  --c: #7b2d26;
  --fg: #f4e8d6;
  position: relative;
  display: block;
  color: var(--fg);
  background:
    linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.10) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.30)),
    var(--c);
  cursor: pointer;
  transition: transform .18s ease, filter .18s ease, opacity .18s ease;
  outline: none;
}
.spine {
  width: var(--w);
  height: var(--h);
  margin-right: 1px;
  border-radius: 2px 2px 0 0;
  writing-mode: vertical-rl;
  font-family: var(--font-spine);
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 10px 0;
  line-height: var(--w);
  text-align: center;
}
.spine.tilt { transform: rotate(-4deg); transform-origin: bottom left; margin-left: 6px; }
.book:hover, .book:focus-visible { filter: brightness(1.25); }
.spine { transform: rotate(var(--lean, 0deg)); }
.spine.leaning { transform-origin: bottom left; }
.spine:hover, .spine:focus-visible { transform: rotate(var(--lean, 0deg)) translateY(-8px); }
.book:focus-visible { box-shadow: 0 0 0 2px var(--lamp); }
.searching .book:not(.match) { opacity: .25; filter: saturate(.3); }
.searching .spine.match { transform: rotate(var(--lean, 0deg)) translateY(-10px); box-shadow: 0 0 0 2px var(--lamp); }
.searching .flat.match { transform: translateX(14px); box-shadow: 0 0 0 2px var(--lamp); }

/* shelf decorations */
.deco { margin: 0 8px; position: relative; }
.plant { width: 46px; height: 70px; }
.plant .pot { position: absolute; bottom: 0; left: 8px; width: 30px; height: 26px; background: #b06a43; border-radius: 2px 2px 8px 8px; }
.plant .leaf { position: absolute; bottom: 22px; left: 20px; width: 12px; height: 40px; background: #5f8a4a; border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%; transform-origin: bottom center; }
.plant .leaf:nth-child(2) { transform: rotate(-35deg); background: #4f7a3e; }
.plant .leaf:nth-child(3) { transform: rotate(32deg); }
.plant .leaf:nth-child(4) { transform: rotate(-62deg); height: 30px; background: #6b9a52; }
.plant .leaf:nth-child(5) { transform: rotate(60deg); height: 30px; background: #4f7a3e; }
.frame-photo { width: 78px; height: 62px; padding: 6px; background: #c9a46b; border-radius: 2px; transform: rotate(-3deg); box-shadow: 2px 3px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.2); }
.frame-photo svg { display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.brain { width: 88px; height: 68px; outline: none; border-radius: 4px; }
.brain:focus-visible { box-shadow: 0 0 0 2px var(--lamp); }
.brain svg { display: block; }
.bookend { width: 40px; height: 72px; }
.bookend svg { display: block; filter: drop-shadow(1px 2px 2px rgba(0,0,0,.45)); }

/* ---------- nook: plaque, window, lamp, chair, table ---------- */
.nook { display: flex; flex-direction: column; align-items: center; gap: 30px; width: min(470px, calc(100vw - 40px)); }
.wall-top { display: flex; align-items: flex-start; justify-content: center; gap: 22px; width: 100%; }
/* felt letter board: white push-in letters on grooved black felt, oak frame */
.letterboard {
  padding: 14px 22px 16px;
  background: repeating-linear-gradient(180deg, #1d1b1a 0 5px, #121110 5px 6px);
  border: 9px solid #a87b4f;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 5px 8px 18px rgba(0,0,0,.5);
  transform: rotate(-1.2deg);
}
.letterboard h1 {
  margin: 0;
  font-family: var(--font-spine);
  font-weight: 700;
  font-size: 22px;
  line-height: 1.5;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-align: center;
  color: #f2efe8;
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.letterboard h1 span { display: block; }
/* index card pinned to the wall, holding the search */
.index-card {
  position: relative;
  margin-top: 18px;
  width: 168px;
  padding: 16px 12px 10px;
  display: grid;
  gap: 4px;
  background: #f3ead8 repeating-linear-gradient(180deg, transparent 0 21px, #b9cbe0 21px 22px);
  border-top: 3px solid #d98a8a;
  box-shadow: 3px 5px 10px rgba(0,0,0,.4);
  transform: rotate(2deg);
}
.index-card::before { content: ""; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a7a, #c8302c); box-shadow: 0 2px 2px rgba(0,0,0,.4); }
.index-card label { font-family: var(--font-hand); font-size: 21px; font-weight: 700; color: #3a2a17; line-height: 1; }
.index-card input { font: inherit; font-size: 15px; padding: 3px 4px; color: #2a1d12; background: rgba(255,255,255,.55); border: 0; border-bottom: 1.5px solid #8a7458; border-radius: 0; width: 100%; }
.index-card input:focus-visible { outline: 2px solid #c8302c; outline-offset: 2px; }
.index-card output { font-family: var(--font-hand); font-size: 17px; color: #8a3b2b; min-height: 1em; }
/* credits below the floor */
.credits { position: relative; padding: 8px 20px 14px; background: #2e1c0f; color: var(--muted); font-size: 13.5px; text-align: center; }
.credits a { color: var(--lamp); }

.window {
  position: relative;
  width: 300px;
  height: 230px;
  border: 12px solid #d9cdb4;
  border-bottom-width: 0;
  background: #0d1528;
  box-shadow: inset 0 0 0 2px #a99c82;
}
.window canvas { display: block; width: 100%; height: 100%; }
.window .mullion-v, .window .mullion-h { position: absolute; background: #d9cdb4; }
.window .mullion-v { left: 50%; top: 0; bottom: 0; width: 8px; transform: translateX(-50%); }
.window .mullion-h { top: 48%; left: 0; right: 0; height: 8px; }
.sill { position: absolute; left: -28px; right: -28px; bottom: -14px; height: 14px; background: #e6dcc6; border-radius: 2px; box-shadow: 0 6px 8px rgba(0,0,0,.4); }
.curtain {
  position: absolute; top: -26px; bottom: -40px; width: 64px;
  background: repeating-linear-gradient(90deg, #7d2f2a 0 10px, #92392f 10px 16px, #6a2622 16px 22px);
  box-shadow: 4px 0 12px rgba(0,0,0,.45);
}
.curtain.l { left: -66px; border-radius: 0 0 40% 0; }
.curtain.r { right: -66px; border-radius: 0 0 0 40%; }
.rod { position: absolute; top: -32px; left: -82px; right: -82px; height: 7px; background: #b8935a; border-radius: 4px; }
.window-wrap { position: relative; margin-top: 30px; }
.deco-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.d-item { position: absolute; }
.d-item svg { display: block; overflow: visible; }
.d-sill-l { left: 8px; bottom: 0; }
.d-sill-r { right: 8px; bottom: 0; }
.d-rod { left: -82px; right: -82px; top: -32px; }
.d-rod svg { width: 100%; height: auto; }
.d-sill-l svg, .d-sill-r svg { transform: scale(1.25); transform-origin: bottom center; }
.d-center { left: 50%; top: 6px; transform: translateX(-50%); }
.d-sill-c { left: 50%; bottom: 0; transform: translateX(-50%); }
.d-item { pointer-events: none; }
.d-item svg * { pointer-events: visiblePainted; cursor: pointer; }
.deco, .cat, .lamp, .glasses, .mug { cursor: pointer; }
.wiggle { animation: wiggle .7s ease-in-out; transform-origin: 50% 100%; }
.swing { animation: swing 1.2s ease-in-out; transform-origin: 50% 0; }
.bounce { animation: bounce .9s ease-in-out; }
@keyframes wiggle { 20% { rotate: -5deg; } 45% { rotate: 4deg; } 70% { rotate: -2deg; } 100% { rotate: 0deg; } }
@keyframes swing { 20% { rotate: 5deg; } 45% { rotate: -4deg; } 70% { rotate: 2deg; } 100% { rotate: 0deg; } }
@keyframes bounce { 20% { translate: 0 4px; } 45% { translate: 0 -2px; } 70% { translate: 0 1px; } 100% { translate: 0 0; } }
.candle:not(.lit) .flame { display: none; }
.lights-off .twinkle { animation: none; opacity: .18; filter: none; }
.globe-flake { opacity: 0; }
.shaken .globe-flake { animation: globe-snow 3.2s ease-out; }
@keyframes globe-snow { 0% { opacity: 1; translate: var(--sx) var(--sy); } 70% { opacity: 1; } 100% { opacity: .9; translate: 0 0; } }
.sparkle .ornaments circle { animation: twinkle .45s ease-in-out 6; }
.sparkle .ornaments circle:nth-child(2n) { animation-delay: .22s; }
.flutter .bat { animation: bat-flutter 1.8s ease-in-out; }
@keyframes bat-flutter { 20% { translate: -12px -14px; } 45% { translate: 10px -24px; } 70% { translate: 16px -6px; } 100% { translate: 0 0; } }
.pumpkin .face-scary { display: none; }
.pumpkin.scary .face-scary { display: inline; }
.pumpkin.scary .face-calm { display: none; }
.pumpkin.scary { animation: shiver .12s linear 8; }
.pumpkin.scary .glow { filter: drop-shadow(0 0 5px #ff5a1a) drop-shadow(0 0 16px #ff3000); }
@keyframes shiver { 25% { translate: 1px 0; } 75% { translate: -1px 0; } }
.floor-leaf { position: absolute; pointer-events: auto; cursor: pointer; }
.floor-leaf svg, .floor-leaf svg * { pointer-events: auto; }
/* the lamp: click to switch it on or off, overriding the time of day until the next reload */
.room.lamp-off .lamp .halo, .room.lamp-off .lamp .bulb { display: none; }
.room.lamp-off .lamp .shade { background: linear-gradient(180deg, #d8c7a4, #b89c70); }
.room.lamp-off:not(.daylight)::before, .room.lamp-off.phone:not(.daylight) .scene-box::before { background: radial-gradient(ellipse 30% 45% at 55% 32%, rgba(150, 175, 230, .08), transparent 70%); }
.room.daylight.lamp-on .lamp .halo, .room.daylight.lamp-on .lamp .bulb { display: block; }
.room.daylight.lamp-on .lamp .shade { background: linear-gradient(180deg, #f6d9a0, #e8b46a); }
.window .mullion-v, .window .mullion-h { pointer-events: none; }
.glow { filter: drop-shadow(0 0 3px rgba(255, 190, 90, .95)) drop-shadow(0 0 8px rgba(255, 160, 60, .6)); }
.twinkle { animation: twinkle 2.6s ease-in-out infinite; }
/* the Halloween spider: sits, twitches, now and then drops down its thread, sways and climbs back */
.spider-sway, .spider-thread, .spider-body, .spider-legs-l, .spider-legs-r { transform-box: view-box; }
.spider-sway { transform-origin: 40px 20px; animation: spider-sway 21s ease-in-out infinite; }
.spider-thread { transform-origin: 40px 20px; animation: spider-thread 21s ease-in-out infinite; }
.spider-body { animation: spider-drop 21s ease-in-out infinite; }
.spider-legs-l { transform-origin: 37px 47px; animation: spider-twitch 7s ease-in-out infinite; }
.spider-legs-r { transform-origin: 43px 47px; animation: spider-twitch 7s ease-in-out infinite reverse; animation-delay: -2.3s; }
@keyframes spider-drop { 0%, 48% { transform: translateY(0); } 58%, 72% { transform: translateY(17px); } 84%, 100% { transform: translateY(0); } }
@keyframes spider-thread { 0%, 48% { transform: scaleY(1); } 58%, 72% { transform: scaleY(1.7); } 84%, 100% { transform: scaleY(1); } }
@keyframes spider-sway { 0%, 58% { transform: rotate(0); } 62% { transform: rotate(5deg); } 66% { transform: rotate(-4deg); } 70% { transform: rotate(2deg); } 74%, 100% { transform: rotate(0); } }
@keyframes spider-twitch { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(-14deg); } 92% { transform: rotate(8deg); } 95% { transform: rotate(-5deg); } }
@keyframes twinkle { 50% { opacity: .35; } }
.wx { position: relative; z-index: 3; max-width: 300px; margin: -14px auto 0; font-size: 20px; line-height: 1.1; color: var(--muted); font-weight: 500; text-align: center; text-wrap: balance; }
.wx span { display: block; }
.wx .wx-occasion { margin-top: 2px; font-size: 17px; color: var(--lamp); opacity: .85; }

.furniture { display: flex; align-items: flex-end; justify-content: center; gap: 2px; width: 100%; }
.lamp { position: relative; width: 80px; height: 300px; }
.lamp .shade { position: absolute; top: 0; left: 0; width: 80px; height: 58px; background: linear-gradient(180deg, #f6d9a0, #e8b46a); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
.lamp .bulb { position: absolute; top: 52px; left: 10px; width: 60px; height: 14px; background: radial-gradient(ellipse at 50% 0, #fff6d8, rgba(255,208,138,.0) 70%); }
.lamp .pole { position: absolute; top: 58px; left: 38px; width: 4px; bottom: 6px; background: linear-gradient(90deg, #6d5a3c, #c0a46e, #6d5a3c); }
.lamp .base { position: absolute; bottom: 0; left: 12px; width: 56px; height: 13px; border-radius: 50% 50% 5px 5px / 100% 100% 5px 5px;
  background: linear-gradient(90deg, #6d5a3c, #d0b47a 40%, #8a7148 75%, #5e4c32); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.lamp .halo { position: absolute; top: -120px; left: -140px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,150,.30), rgba(255,214,150,.08) 40%, transparent 68%); pointer-events: none; z-index: 2; }

.chair { position: relative; width: 210px; height: 200px; }
.chair > div { position: absolute; }
.chair .back { left: 30px; right: 30px; top: 0; height: 140px; border-radius: 48px 48px 10px 10px; background: linear-gradient(180deg, #5a6a44, var(--chair)); box-shadow: inset 0 -12px 18px rgba(0,0,0,.3); }
.chair .back::after { content: ""; position: absolute; left: 50%; top: 20px; width: 2px; height: 90px; background: rgba(0,0,0,.18); }
.chair .seat { left: 34px; right: 34px; top: 112px; height: 40px; border-radius: 14px; background: linear-gradient(180deg, #66784d, #4d5b3a); }
.chair .arm { top: 78px; width: 46px; height: 92px; border-radius: 24px 24px 8px 8px; background: linear-gradient(90deg, #44512f, #5c6c44 50%, #44512f); box-shadow: 0 6px 10px rgba(0,0,0,.35); }
.chair .arm.l { left: 0; }
.chair .arm.r { right: 0; }
.chair .skirt { left: 8px; right: 8px; top: 160px; height: 22px; border-radius: 4px; background: #3d4a2c; }
.chair .leg { bottom: 0; width: 9px; height: 20px; background: var(--wood-dark); border-radius: 0 0 3px 3px; }
.chair .leg.l { left: 22px; }
.chair .leg.r { right: 22px; }
.chair .throw { right: -6px; top: 70px; width: 58px; height: 110px; border-radius: 8px 8px 4px 14px;
  background:
    repeating-linear-gradient(90deg, rgba(255,240,210,.0) 0 10px, rgba(255,240,210,.35) 10px 13px),
    repeating-linear-gradient(0deg, rgba(120,30,30,.0) 0 10px, rgba(255,240,210,.30) 10px 13px),
    #a0453a;
  transform: rotate(4deg); box-shadow: 0 6px 10px rgba(0,0,0,.35); }
.cat { left: 56px; top: 92px; width: 100px; height: 40px; z-index: 3; }  /* in front of the book on the armrest when she stands up */
.cat .body { position: absolute; left: 0; bottom: 0; width: 82px; height: 34px; border-radius: 50% 50% 40% 40%; background: linear-gradient(180deg, #d88a45, #b96d2f); }
.cat .head { position: absolute; right: 2px; bottom: 4px; width: 32px; height: 28px; border-radius: 50%; background: #d88a45; }
.cat .ear { position: absolute; bottom: 24px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid #c87a3a; }
.cat .ear.a { right: 6px; }
.cat .ear.b { right: 20px; transform: rotate(-12deg); }
.cat .eye { position: absolute; bottom: 15px; width: 7px; height: 2px; border-radius: 2px; background: #3a2414; }
.cat .eye.a { right: 8px; }
.cat .eye.b { right: 20px; }
.cat .tail { position: absolute; transform-origin: 100% 100%; left: -12px; bottom: -2px; width: 46px; height: 18px; border: 6px solid #b96d2f; border-top: 0; border-right: 0; border-radius: 0 0 0 20px; }
.cat .zz-wrap { position: absolute; right: 30px; bottom: 30px; width: 30px; height: 40px; z-index: 5; pointer-events: none; }
.cat .zz { position: absolute; left: 0; bottom: 0; font-family: var(--font-hand); font-weight: 700; color: #efe2c8; font-size: 17px; opacity: 0; animation: zz-float 4.2s ease-out infinite; }
.cat .zz.z2 { font-size: 20px; animation-delay: 1.4s; }
.cat .zz.z3 { font-size: 24px; animation-delay: 2.8s; }
@keyframes zz-float { 0% { opacity: 0; translate: 0 0; } 15% { opacity: .9; } 100% { opacity: 0; translate: 14px -34px; } }
/* now and then: one eye half opens; later the head comes up, both eyes look around, back to sleep */
.cat .cat-head { position: absolute; inset: 0; transform-origin: 84% 92%; animation: cat-head 32s ease-in-out infinite; }
.cat .eye-open { position: absolute; bottom: 13px; width: 7px; height: 5px; border-radius: 50%; background: #e2c04a; opacity: 0; box-shadow: 0 0 0 .5px #6a4a1a; }
.cat .eye-open::after { content: ""; position: absolute; left: 2.5px; top: .5px; width: 2px; height: 4px; border-radius: 1px; background: #1a120c; animation: cat-look 32s ease-in-out infinite; }
.cat .eye-open.a { right: 8px; animation: cat-eye-a 32s ease-in-out infinite; }
.cat .eye-open.b { right: 20px; animation: cat-eye-b 32s ease-in-out infinite; }
.cat .zz-wrap { animation: cat-zz 32s ease-in-out infinite; }
/* startled by a click: up she goes (eyes wide, ears up, tail puffed), then a suspicious look around
   with narrowed eyes, and only then back to sleep. After the sleep rules, so these win. */
.chair .cat.startled { animation: cat-startle 1s ease-out; }
.chair .cat.startled .cat-head { animation: cat-sus-head 9s ease-in-out forwards; }
.chair .cat.startled .eye-open { animation: cat-sus-eyes 9s ease-in-out forwards; }
.chair .cat.startled .eye-open::after { animation: cat-sus-look 9s ease-in-out forwards; }
.chair .cat.startled .zz-wrap { animation: cat-sus-zz 9s linear forwards; }
.chair .cat.startled .ear { animation: cat-sus-ears 9s ease-in-out forwards; }
.chair .cat.startled .tail { animation: cat-sus-tail 9s ease-in-out forwards; }
.cat .cat-lift { position: absolute; inset: 0; }
.cat .cat-legs { position: absolute; inset: 0; }
.cat .cat-legs i { position: absolute; bottom: -2px; width: 6px; height: 19px; border-radius: 3px 3px 2px 2px; background: #c87a3a; transform-origin: 50% 100%; scale: 1 0; }
.cat .cat-legs i:nth-child(1) { left: 9px; } .cat .cat-legs i:nth-child(2) { left: 20px; }
.cat .cat-legs i:nth-child(3) { left: 58px; } .cat .cat-legs i:nth-child(4) { left: 69px; }
/* standing: legs out, body up and arched, then lying down again */
.chair .cat.startled .cat-legs i { animation: cat-stand-legs 9s ease-in-out forwards; }
.chair .cat.startled .cat-lift { animation: cat-stand-lift 9s ease-in-out forwards; }
.chair .cat.startled .body { animation: cat-arch 9s ease-in-out forwards; }
@keyframes cat-stand-legs { 0% { scale: 1 0; } 4%, 48% { scale: 1 1; } 56%, 100% { scale: 1 0; } }
@keyframes cat-stand-lift { 0% { translate: 0 0; } 4%, 48% { translate: 0 -16px; } 56%, 100% { translate: 0 0; } }
@keyframes cat-arch { 0%, 56%, 100% { border-radius: 50% 50% 40% 40%; height: 34px; } 5%, 14% { border-radius: 50% 50% 16% 16% / 100% 100% 14% 14%; height: 30px; } 24%, 46% { border-radius: 50% 50% 26% 26% / 90% 90% 22% 22%; height: 30px; } }
@keyframes cat-startle { 10% { translate: 0 -26px; rotate: -4deg; } 30% { translate: 0 -12px; rotate: 2deg; } 50% { translate: 0 0; rotate: 0deg; } 65% { translate: 0 -4px; } 100% { translate: 0 0; } }
@keyframes cat-sus-head { 0%, 46% { transform: translate(-1px, -10px) rotate(-6deg); } 22% { transform: translate(-2px, -10px) rotate(-9deg); } 34% { transform: translate(0, -10px) rotate(-3deg); } 56%, 90% { transform: translate(-1px, -4px) rotate(-3deg); } 70% { transform: translate(-1px, -4px) rotate(-5deg); } 98%, 100% { transform: none; } }
@keyframes cat-sus-eyes { 0%, 9% { opacity: 1; transform: scale(1.35); } 14%, 90% { opacity: 1; transform: scale(1.1, .5); } 95% { opacity: 1; transform: scale(1, .22); } 98%, 100% { opacity: 0; transform: scale(1, .2); } }
@keyframes cat-sus-look { 0%, 12% { transform: scale(.6, 1); } 17%, 22% { transform: translateX(-1.8px) scale(.6, 1); } 28%, 34% { transform: translateX(1.8px) scale(.6, 1); } 40%, 57% { transform: scale(.6, 1); } 61%, 64% { transform: translateX(-1.8px) scale(.6, 1); } 69%, 72% { transform: translateX(1.8px) scale(.6, 1); } 76%, 78% { transform: translateX(-1.6px) scale(.6, 1); } 83%, 86% { transform: translateX(1.6px) scale(.6, 1); } 90%, 100% { transform: scale(.6, 1); } }
@keyframes cat-sus-zz { 0%, 97% { opacity: 0; } 100% { opacity: 1; } }
@keyframes cat-sus-ears { 0%, 10% { translate: 0 -3px; } 18%, 90% { translate: 0 -1px; } 98%, 100% { translate: 0 0; } }
@keyframes cat-sus-tail { 0%, 9% { border-width: 10px; rotate: 48deg; } 22% { border-width: 7px; rotate: 34deg; } 32% { rotate: 42deg; } 46% { rotate: 30deg; } 56% { border-width: 6px; rotate: 6deg; } 68% { rotate: 14deg; } 78% { rotate: 4deg; } 86% { rotate: 10deg; } 100% { border-width: 6px; rotate: 0deg; } }
@keyframes cat-head { 0%, 74% { transform: none; } 77%, 87% { transform: translate(-1px, -9px) rotate(-7deg); } 90%, 100% { transform: none; } }
@keyframes cat-eye-a { 0%, 58% { opacity: 0; transform: scaleY(.5); } 59.5%, 64% { opacity: 1; transform: scaleY(.55); } 65.5%, 76% { opacity: 0; transform: scaleY(1); } 77.5%, 87.5% { opacity: 1; transform: scaleY(1); } 89%, 100% { opacity: 0; } }
@keyframes cat-eye-b { 0%, 76% { opacity: 0; } 77.5%, 87.5% { opacity: 1; } 89%, 100% { opacity: 0; } }
@keyframes cat-look { 0%, 78% { transform: none; } 80%, 81.5% { transform: translateX(-1.6px); } 83.5%, 85% { transform: translateX(1.6px); } 87%, 100% { transform: none; } }
@keyframes cat-zz { 0%, 74% { opacity: 1; } 76%, 89% { opacity: 0; } 92%, 100% { opacity: 1; } }
@keyframes zz { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: .9; transform: translateY(-6px); } }
.mug { left: 10px; top: 56px; width: 22px; height: 24px; background: #e9e0cf; border-radius: 2px 2px 6px 6px; }
.mug::after { content: ""; position: absolute; left: -8px; top: 5px; width: 8px; height: 10px; border: 3px solid #e9e0cf; border-right: 0; border-radius: 6px 0 0 6px; }
.steam { position: absolute; bottom: 26px; width: 4px; height: 18px; border-radius: 4px; background: rgba(255,255,255,.35); filter: blur(1.5px); animation: steam 2.8s ease-in-out infinite; }
.steam.a { left: 5px; }
.steam.b { left: 13px; animation-delay: 1.3s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px) scaleX(1); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-16px) scaleX(2.2); } }

.table-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stack { display: flex; flex-direction: column; align-items: center; }
.flat {
  height: var(--t, 22px);
  width: var(--w);
  padding: 0 10px;
  border-radius: 2px 4px 4px 2px;
  font-family: var(--font-spine);
  font-weight: 700;
  font-size: 12px;
  line-height: var(--t, 22px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background:
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,0) 40%, rgba(0,0,0,.3)),
    var(--c);
  transform: translateX(var(--x, 0)) rotate(var(--r, 0deg));
}
.flat:hover, .flat:focus-visible { transform: translateX(calc(var(--x, 0px) + 12px)) rotate(var(--r, 0deg)); }
/* Dirk's own: rectangular dark-brown frames, softly rounded, blue-light coating */
.glasses { position: relative; width: 82px; height: 22px; margin: 8px 0 -9px 30px; transform: rotate(-4deg); z-index: 1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
.glasses i { position: absolute; display: block; }
.glasses .lens { bottom: 0; width: 33px; height: 18px; border: 3px solid #4a3020; border-radius: 4px 4px 7px 7px;
  box-shadow: inset 0 0 0 1px rgba(255,220,180,.18), 0 -1px 0 rgba(255,220,180,.25);
  background: linear-gradient(135deg, rgba(255,255,255,.5), rgba(170,160,230,.30) 35%, rgba(120,140,220,.22) 70%, rgba(200,190,240,.32)); }
.glasses .lens.l { left: 3px; }
.glasses .lens.r { right: 3px; }
.glasses .bridge { left: 35px; bottom: 9px; width: 12px; height: 6px; border: 3px solid #4a3020; border-bottom: 0; border-radius: 8px 8px 0 0; }
.glasses .temple { bottom: 13px; width: 26px; height: 3px; background: #3d2719; border-radius: 2px; }
.glasses .temple.l { left: 8px; transform: rotate(-16deg); transform-origin: left center; }
.glasses .temple.r { right: 8px; transform: rotate(16deg); transform-origin: right center; }
.typewriter { position: absolute; left: 42px; top: 12px; display: block; outline: none; }
.typewriter svg { display: block; overflow: visible; filter: drop-shadow(1px 3px 3px rgba(0,0,0,.45)); }
.typewriter:focus-visible { box-shadow: 0 0 0 2px var(--lamp); border-radius: 4px; }
.tw-ding { opacity: 0; }
.typing .tw-key { animation: tw-key .16s ease-in-out 3; }
.typing .tw-paper { animation: tw-paper .9s ease-out forwards; }
.typing .tw-ding { animation: tw-ding .9s ease-out forwards; }
@keyframes tw-key { 50% { translate: 0 1.6px; } }
@keyframes tw-paper { 100% { translate: 0 -5px; } }
@keyframes tw-ding { 0%, 55% { opacity: 0; translate: 0 0; } 70% { opacity: 1; } 100% { opacity: 0; translate: 4px -8px; } }
.door { display: block; flex: none; outline: none; }
.door svg { display: block; box-shadow: 6px 10px 22px rgba(0,0,0,.45); }
.door .door-panel { transform-origin: 11px 130px; transform: scaleX(.66); transition: transform .5s ease-in-out; }
.door:hover .door-panel, .door:focus-visible .door-panel { transform: scaleX(.6); }
.door.opening .door-panel { transform: scaleX(.12); transition-duration: .7s; }
.door:focus-visible svg { outline: 2px solid var(--lamp); outline-offset: 3px; }
/* ---------- on top of the bookcase: a mantel clock with Toronto time, the wooden toy train and the reading-goal jar ---------- */
.clock { width: 58px; height: 74px; outline: none; }
.clock svg { display: block; overflow: visible; }
.clock:focus-visible { box-shadow: 0 0 0 2px var(--lamp); border-radius: 4px; }
.pendulum { transform-box: view-box; transform-origin: 29px 54px; animation: pendulum 2s ease-in-out infinite alternate; }
@keyframes pendulum { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.case-top-row { display: flex; align-items: flex-end; justify-content: space-between; width: min(600px, calc(100vw - 40px)); height: 96px; margin-bottom: -6px; padding: 0 34px; position: relative; z-index: 1; }
.train { outline: none; border-radius: 4px; }
.train svg { display: block; overflow: visible; }
.train:focus-visible { box-shadow: 0 0 0 2px var(--lamp); }
.train .puff { opacity: 0; transform-box: fill-box; transform-origin: center; }
.chug { animation: chug 1.8s ease-in-out; }
.chug .puff { animation: puff 1.4s ease-out; }
.chug .puff:nth-of-type(2) { animation-delay: .35s; }
.chug .puff:nth-of-type(3) { animation-delay: .7s; }
@keyframes chug { 30% { translate: -16px 0; } 45% { translate: -16px 0; } 100% { translate: 0 0; } }
@keyframes puff { 0% { opacity: .8; transform: translate(0, 0) scale(.5); } 100% { opacity: 0; transform: translate(10px, -26px) scale(1.6); } }
.jar { width: 64px; height: 87px; outline: none; border-radius: 4px; }
.jar svg { display: block; overflow: visible; }
.jar:focus-visible { box-shadow: 0 0 0 2px var(--lamp); }
/* a book finished in the last week, lying open on the armrest */
.open-book { position: absolute; right: -14px; top: 60px; width: 80px; height: 30px; z-index: 2; background: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); }
.open-book svg { display: block; }
.open-book:hover, .open-book:focus-visible { transform: translateY(-4px); }
.just-tag { position: absolute; right: 4px; top: 6px; z-index: 3; font-size: 20px; transform: rotate(-8deg); pointer-events: none; white-space: nowrap; }
/* the cat: under a blanket in winter, on the windowsill at dusk */
.cat .blanket { display: none; position: absolute; left: -4px; bottom: -3px; width: 70px; height: 26px; border-radius: 40% 50% 6px 6px / 70% 80% 6px 6px;
  background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,240,210,.35) 8px 11px), repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,240,210,.3) 8px 11px), #2f5f6b;
  box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.room.winter .cat .blanket { display: block; }
.room.winter .cat .tail { display: none; }
.sill-cat { display: none; position: absolute; left: 35%; bottom: 0; z-index: 3; pointer-events: auto; cursor: pointer; }
.sill-cat svg { display: block; overflow: visible; }
.sill-cat .sc-tail { transform-box: fill-box; transform-origin: 0 100%; animation: tail-swish 5s ease-in-out infinite; }
.sill-cat.look .sc-head { animation: sc-look 1.6s ease-in-out; transform-box: fill-box; transform-origin: 50% 90%; }
@keyframes tail-swish { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(14deg); } 80% { transform: rotate(-6deg); } 90% { transform: rotate(8deg); } }
@keyframes sc-look { 30%, 60% { transform: rotate(-16deg) translateX(-2px); } }
.room.cat-out .chair .cat { display: none; }
.room.cat-out .sill-cat { display: block; }
/* the sort switch, written next to the bookcase */
.sort-switch { padding: 0; background: none; border: 0; cursor: pointer; text-decoration: underline dotted rgba(187, 166, 139, .6); text-underline-offset: 5px; }
.sort-switch:hover small, .sort-switch:focus-visible small { color: var(--lamp); }
.sort-switch:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; border-radius: 3px; }
.side-table { position: relative; width: 168px; height: 112px; }
.side-table .top { position: absolute; top: 0; left: 0; right: 0; height: 12px; background: linear-gradient(180deg, #a06c40, var(--wood)); border-radius: 3px; box-shadow: 0 4px 6px rgba(0,0,0,.4); }
.side-table .shelf { position: absolute; top: 66px; left: 10px; right: 10px; height: 8px; background: var(--wood); }
.side-table .leg { position: absolute; top: 12px; bottom: 0; width: 9px; background: var(--wood-dark); }
.side-table .leg.l { left: 14px; }
.side-table .leg.r { right: 14px; }

/* ---------- to-read piles ---------- */
.piles-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(330px, calc(100vw - 40px)); }
.note { padding: 10px 14px 12px; background: #f1e3b5; color: #3a2a17; transform: rotate(2deg); box-shadow: 3px 5px 10px rgba(0,0,0,.4); max-width: 230px; }
.note .hand { color: #3a2a17; font-size: 26px; }
.note .hand small { color: #6a5434; }
.piles { display: flex; align-items: flex-end; gap: 14px; }
.pile { display: flex; flex-direction: column; align-items: center; }
.pile .flat { height: var(--t, 9px); line-height: var(--t, 9px); font-size: 0; padding: 0; border-radius: 1px 3px 3px 1px; }

.wallshelf { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.wallshelf .shelves { --row: 100px; --plank: 14px; padding: 0 8px var(--plank); background:
    repeating-linear-gradient(180deg, transparent 0, transparent calc(var(--row) - 1px),
      #8a5a34 calc(var(--row) - 1px), var(--wood) calc(var(--row) + 3px), #5e3b20 calc(var(--row) + var(--plank))); }
.wallshelf .spine { font-size: 10.5px; }
.leaf-mark { color: #d9534a; }
.floor-row { display: flex; align-items: flex-end; gap: 16px; }
.box { position: relative; width: 150px; height: 150px; }
.box .inside { position: absolute; left: 10px; right: 10px; bottom: 40px; display: flex; align-items: flex-end; justify-content: center; gap: 1px; }
.box .inside .spine { font-size: 0; padding: 0; }
.box .inside .spine:nth-child(3n) { transform: rotate(-6deg); }
.box .inside .spine:nth-child(4n) { transform: rotate(5deg); }
.box .inside .spine:hover, .box .inside .spine:focus-visible { transform: translateY(-10px); }
.box .front { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: linear-gradient(180deg, #b98a55, #9c6f3f); border-radius: 2px; box-shadow: 4px 6px 12px rgba(0,0,0,.45); pointer-events: none; display: grid; place-items: center; }
.box .front::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #8a5f33; }
.box .front .hand { color: #3a2a17; font-size: 23px; transform: rotate(-3deg); }
.box .front .hand small { color: #4f3a20; font-size: 18px; }
.box .flap { position: absolute; bottom: 70px; width: 64px; height: 26px; background: #a77945; pointer-events: none; }
.box .flap.l { left: -18px; transform: rotate(-24deg); transform-origin: right bottom; }
.box .flap.r { right: -18px; transform: rotate(24deg); transform-origin: left bottom; }

/* ---------- tooltip ---------- */
.tip {
  position: absolute;
  z-index: 10;
  max-width: 340px;
  padding: 10px 14px 12px;
  background: #f3ead8;
  color: #2a1d12;
  border-radius: 3px;
  box-shadow: 0 10px 24px rgba(0,0,0,.55);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .12s ease, transform .12s ease;
}
.tip.on { opacity: 1; transform: none; }
.tip .t { font-family: var(--font-display); font-size: 18px; line-height: 1.2; }
.tip .a { font-size: 15px; color: #5a4430; margin-top: 2px; }
.tip .s { font-family: var(--font-hand); font-size: 19px; color: #8a3b2b; margin-top: 6px; }
.tip .r { margin-top: 6px; font-size: 18px; letter-spacing: 2px; color: #b8862b; }
.tip .r span { color: #cdbfa6; }
.tip .h { font-weight: 700; margin-top: 4px; font-size: 15px; }
.tip .v { margin-top: 4px; font-size: 14.5px; line-height: 1.4; color: #3d2c1d; white-space: pre-line; }
.tip .f { font-size: 14px; color: #7a6450; }
.tip .r:empty, .tip .h:empty, .tip .v:empty, .tip .f:empty { display: none; }

/* ---------- book card ---------- */
.card {
  width: min(680px, calc(100vw - 32px));
  max-height: min(640px, calc(100vh - 48px));
  padding: 26px 28px 24px;
  border: 0;
  border-radius: 4px;
  background: #f3ead8 repeating-linear-gradient(180deg, transparent 0 27px, rgba(150, 120, 80, .10) 27px 28px);
  color: #2a1d12;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  overflow: auto;
}
.card[open] { display: grid; grid-template-columns: 150px 1fr; gap: 26px; align-items: start; }
.card::backdrop { background: rgba(14, 9, 6, .62); }
.card-close {
  position: absolute; top: 8px; right: 10px;
  width: 36px; height: 36px;
  font: 400 28px/1 var(--font-body);
  color: #5a4430; background: transparent; border: 0; border-radius: 50%; cursor: pointer;
}
.card-close:hover, .card-close:focus-visible { background: rgba(90, 68, 48, .12); outline: none; }
.card-art { position: sticky; top: 0; }
.card-cover-img { display: block; width: 150px; height: auto; max-height: 240px; object-fit: cover; border-radius: 2px 5px 5px 2px; box-shadow: 4px 8px 16px rgba(0,0,0,.35); background: var(--c); }
.card-cover-img[hidden], .card-cover[hidden] { display: none; }
.card-cover {
  aspect-ratio: 2 / 3;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 18px 14px;
  border-radius: 2px 6px 6px 2px;
  color: var(--fg);
  background:
    linear-gradient(90deg, rgba(0,0,0,.35) 0 6px, rgba(255,255,255,.12) 6px 9px, transparent 9px),
    linear-gradient(160deg, rgba(255,255,255,.12), rgba(0,0,0,.18)),
    var(--c);
  box-shadow: 4px 8px 16px rgba(0,0,0,.35);
}
.card-cover::before { content: ""; height: 2px; background: currentColor; opacity: .5; order: 1; }
.cc-title { font-family: var(--font-display); font-size: 19px; line-height: 1.15; text-wrap: balance; order: 0; overflow-wrap: anywhere; }
.cc-author { font-family: var(--font-spine); font-weight: 700; font-size: 12px; letter-spacing: .04em; order: 2; }
.card-body { display: grid; gap: 6px; min-width: 0; }

.card-stars { font-size: 20px; letter-spacing: 2px; color: #b8862b; }
.card-stars span { color: #cdbfa6; }
.card-about, .card-mine { display: grid; gap: 4px; margin-top: 10px; }
.card-about[hidden], .card-mine[hidden], .card-more[hidden] { display: none; }
.card-label { font-size: 19px; color: #8a3b2b; }
.card-desc { font-size: 15.5px; line-height: 1.5; color: #4a3826; white-space: pre-line; max-width: 62ch;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.card-desc.open { display: block; -webkit-line-clamp: unset; }
.card-more { justify-self: start; padding: 0; font: inherit; font-size: 15px; font-weight: 700; color: #8a3b2b; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.card-more:focus-visible { outline: 2px solid #8a3b2b; outline-offset: 2px; }
.card-head { font-weight: 700; font-size: 17px; }
.card-review { font-size: 16.5px; line-height: 1.55; white-space: pre-line; max-width: 62ch; }
.card-head:empty, .card-review:empty, .card-stars:empty, .card-date:empty, .card-pages:empty { display: none; }
.card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; }
.card-copy { padding: 0; font: inherit; font-size: 15px; font-weight: 700; color: #8a3b2b; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.card-link:hover, .card-link:focus-visible { background: #4a3322; outline: 2px solid var(--lamp); outline-offset: 2px; }
@media (max-width: 560px) {

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  return () => { seed = (Math.imul(seed ^ (seed >>> 15), 2246822507) + 0x6d2b79f5) >>> 0; return seed / 4294967296; };
}
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.6 ? "#2a1d12" : "#f4e8d6";
}
function shortTitle(t) {
  return t.split(/ - |: | \(/)[0].trim();
}

const all = [];
function makeBook(b, shelf, cls) {
  // a button, not a link: the Claude app opens links even when the page cancels the click
  const el = document.createElement("span");
  el.setAttribute("role", "button");
  el.tabIndex = 0;
  el.className = "book " + cls;
  el._href = BASE + b.u;

  const r = rng(hash(b.t + b.a));
  const cloth = CLOTH[Math.floor(r() * CLOTH.length)];
  const c = b.sc || cloth;  // the cover's colour where we have one
  el.style.setProperty("--c", c);
  el.style.setProperty("--fg", inkFor(c));
  el._rand = r;
  el._book = b;
  el._shelf = shelf;
  el._i = all.length;  // the order the build gave: by author

  return el;
}

const DECO_SLOTS = Object.fromEntries(Object.entries({ plant: decor[14], photo: decor[33], bookend: decor[70], brain: decor[52] })

    const slot = document.createElement("div");

const DECO_WIDTH = { plant: 62, photo: 98, bookend: 56, brain: 104 };

// Lay out the bookcase ourselves so the decorations stay well placed as books come and go:
// one decoration per shelf (plant, photo, bookend), and Norbert at the start of the bottom shelf.
function layoutBookcase() {
  const capacity = shelves.clientWidth - 20 - 2;  // padding, and a little slack for rounding
  const width = slot => {
    const sp = slot.firstElementChild;
    return parseFloat(sp.style.getPropertyValue("--w")) + 1;
  };
  const pack = plan => {
    const rows = [];
    let i = 0;
    while (i < bookSlots.length) {
      const deco = plan[rows.length];
      let used = deco ? DECO_WIDTH[deco] : 0;
      const books = [];
      while (i < bookSlots.length && (books.length === 0 || used + width(bookSlots[i]) <= capacity)) {
        used += width(bookSlots[i]);
        books.push(bookSlots[i++]);
      }
      rows.push({ books, deco, used });
    }
    return rows;
  };
  // Norbert needs room on the bottom shelf; where a row ends depends on the order of the books, so if he
  // doesn't fit, try the decorations on other rows, then without the plant, before giving him a shelf of his own
  const plans = [["plant", "photo", "bookend"], ["photo", "plant", "bookend"], ["plant", "bookend", "photo"],
    ["bookend", "plant", "photo"], ["photo", "bookend", "plant"], ["bookend", "photo", "plant"], ["photo", "bookend"]];
  const fits = rows => rows[rows.length - 1].used + DECO_WIDTH.brain <= capacity;
  let rows = plans.map(pack).find(fits);
  if (rows) rows[rows.length - 1].brainFirst = true;
  else (rows = pack(plans[0])).push({ books: [], brainFirst: true });
  const at = { plant: 0.72, photo: 0.18, bookend: 1 };  // where in the row each decoration stands
  shelves.innerHTML = "";
  bookSlots.forEach(slot => {
    const sp = slot.firstElementChild;
    sp.classList.remove("leaning"); sp.style.removeProperty("--lean"); sp.style.marginLeft = "";
  });
  rows.forEach(row => {
    const div = document.createElement("div");
    div.className = "shelf-row";
    const items = [...row.books];
    if (row.deco) items.splice(Math.round(at[row.deco] * row.books.length), 0, DECO_SLOTS[row.deco]);
    if (row.brainFirst) items.unshift(DECO_SLOTS.brain);
    // a row with room to spare: its last book leans back against its neighbour, foot out into the gap
    const free = capacity - (row.used || 0) - (row.brainFirst ? DECO_WIDTH.brain : 0);
    const lastSlot = items[items.length - 1];
    const prevSlot = items[items.length - 2];
    if (free >= 28 && lastSlot && bookSlots.includes(lastSlot) && prevSlot && bookSlots.includes(prevSlot)) {
      // Rotating about its bottom-left corner, the book's left edge at height y sits y*tan(angle) left of
      // its foot. It rests on the neighbour's top corner, or with its own top corner on the neighbour's
      // side if the neighbour is taller, so the foot goes that far out from the neighbour.
      const sp = lastSlot.firstElementChild;
      const h = parseFloat(sp.style.getPropertyValue("--h"));
      const hn = parseFloat(prevSlot.firstElementChild.style.getPropertyValue("--h"));
      const rad = d => d * Math.PI / 180;
      let deg = 8 + (hash(sp._book.t) % 7);
      const pushFor = d => Math.min(hn, h * Math.cos(rad(d))) * Math.tan(rad(d));
      while (deg > 3 && pushFor(deg) > free - 6) deg -= 0.5;
      sp.classList.add("leaning");
      sp.style.setProperty("--lean", -deg.toFixed(1) + "deg");
      sp.style.marginLeft = (pushFor(deg) - 1).toFixed(1) + "px";  // the neighbour's 1px margin
    }
    items.forEach(x => div.appendChild(x));
    shelves.appendChild(div);
  });
}

function colourKey(el) {
  const n = parseInt(el.style.getPropertyValue("--c").slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;

  const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 20) % 360;  // start with the reds just below 360 degrees
}

function renderDecor(t) {
  t.n = dayNum(t.y, t.m, t.d);
  const active = DECOR.filter(x => x.when(t));
  const where = { "sill-l": "deco", "sill-r": "deco", "sill-c": "deco", rod: "deco", center: "deco", floor: "floor-deco" };
  room.classList.toggle("pride", t.m === 6);
  const sig = `${t.y}-${t.m}-${t.d}:` + active.map(x => DECOR.indexOf(x)).join(",");
  if (sig !== renderDecor.sig) ["deco", "case-deco", "floor-deco"].forEach(id => {
    document.getElementById(id).innerHTML = active.filter(x => x.slot && (where[x.slot] || "case-deco") === id)
      .map(x => `<div class="d-item d-${x.slot}">${x.svg(t)}</div>`).join("");
  });
  renderDecor.sig = sig;
  const labels = [...new Set(active.map(x => x.label(t)).filter(Boolean))];
  const GENERIC = ["Winter", "Spring", "Summer", "Harvest", "Cozy season"];  // give way to a named occasion
  const named = labels.filter(l => !GENERIC.includes(l));
  return (named.length ? named : labels).join(" · ");
}

// ---- click reactions: startle the cat, nudge decorations, scare pumpkins, blow leaves, switch the lamp
function replay(el, cls, ms) {
  el.classList.remove(cls);
  void el.getBoundingClientRect();  // restart the animation
  el.classList.add(cls);
  clearTimeout(el._replay);
  el._replay = setTimeout(() => el.classList.remove(cls), ms);
}
// A gust lifts the leaf a little and carries it sideways; then it sinks slowly, swinging side to side
// like a pendulum and tilting with each swing. One smooth curve, computed per frame.
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function gust(leaf) {
  const floorWidth = leaf.parentElement.clientWidth;
  let lift = 46, dir = Math.random() < 0.5 ? -1 : 1;
  if (leaf._flight) {
    // caught again in mid-air: start from where it is, with a fresh gust, maybe the other way
    const [tx, ty] = (leaf.style.translate || "0px 0px").split(" ").map(parseFloat);
    leaf.style.left = (parseFloat(leaf.style.left) + (tx || 0) / floorWidth * 100).toFixed(2) + "%";
    leaf.style.top = (parseFloat(leaf.style.top) + (ty || 0)).toFixed(1) + "px";
    leaf.style.translate = "";
    dir = Math.random() < 0.5 ? -leaf._dir : leaf._dir;
    lift = 30;
  }
  const left = parseFloat(leaf.style.left), top = parseFloat(leaf.style.top), rot = parseFloat(leaf.style.rotate) || 0;
  const dx = (leaf._flight ? 40 : 60) + Math.random() * 80;  // px
  const pct = d => left + d * dx / floorWidth * 100;
  if (pct(dir) < 2 || pct(dir) > 95) dir = -dir;
  const newTop = Math.round(4 + Math.random() * 38), dy = newTop - top;
  const flight = {};
  leaf._flight = flight;
  leaf._dir = dir;
  const finish = () => {
    leaf.style.left = pct(dir).toFixed(1) + "%";
    leaf.style.top = newTop + "px";
    leaf.style.rotate = (rot + dir * 90).toFixed(1) + "deg";
    leaf.style.translate = "";
    leaf._flight = null;
  };
  if (reduceMotion) return finish();
  const T = 4600, RISE = 0.3, SWINGS = 1.5;
  const t0 = performance.now();
  (function frame(now) {
    if (leaf._flight !== flight) return;  // another gust took over
    const s = Math.min(1, (now - t0) / T);
    // height: ease up to the top, then ease down to the floor (zero speed at the top, no corners)
    const y = s < RISE ? -lift * Math.sin((Math.PI / 2) * (s / RISE))
